
<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      SortFresh – Kitchen Inventory & Food Expiry Tracker
    </title>

    <meta
      name="description"
      content="SortFresh is a free kitchen inventory app for organising your fridge, freezer and pantry. Track groceries, monitor food expiry dates and manage your kitchen in one place."
    />

    <meta name="author" content="BRC HUB LLP" />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta name="googlebot" content="index, follow" />

    <meta name="theme-color" content="#FFF9EF" />

    <meta name="content-language" content="en-IN" />

    <!-- Canonical URL: Replace with your actual live domain -->

    <!-- Geographic context: Indian English audience -->
    <meta name="geo.region" content="IN" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->

    <meta
      property="og:site_name"
      content="SortFresh"
    />

    <meta
      property="og:title"
      content="SortFresh – A Happier, More Organised Kitchen"
    />

    <meta
      property="og:description"
      content="Organise your fridge, freezer and pantry in one place. Track what you have, monitor expiry dates and make every grocery count with SortFresh."
    />

    <meta
      property="og:url"
      content="https://sortfresh.brchub.tech/"
    />

    <meta
      property="og:image"
      content="https://sortfresh.brchub.tech/images/og-image.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://sortfresh.brchub.tech/images/og-image.jpg"

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta

      property="og:image:alt"
      content="SortFresh – Organise your fridge, pantry and freezer in one place."

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="SortFresh – A Happier, More Organised Kitchen"
    />

      name="twitter:description"

      name="twitter:image"
      content="https://sortfresh.brchub.tech/images/og-image.jpg"
    />

      name="twitter:image:alt"

    />

      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Structured Data: SortFresh Software Application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "@id": "https://sortfresh.brchub.tech/#app",
        "name": "SortFresh",
        "description": "SortFresh is a free kitchen inventory application that helps users organise their refrigerator, freezer and pantry, track groceries and monitor food expiry dates.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Android",
        "inLanguage": "en-IN",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "author": {
          "@type": "Organization",
          "name": "BRC HUB LLP",
          "url": "https://sortfresh.brchub.tech/"
        },
        "featureList": [
          "Kitchen inventory management",
          "Refrigerator and freezer organisation",
          "Pantry inventory management",
          "Food expiry date tracking",
          "Expiry reminders",
          "On-device data storage",
          "No account registration required"
        ]
      }
    </script>

    <!-- Structured Data: Brand / Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://sortfresh.brchub.tech/#organization",

        "url": "https://sortfresh.brchub.tech/",
        "brand": {
          "@type": "Brand",
          "name": "SortFresh"
        }
      }
